[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosed-analysis"
version = "0.1.0"
description = "Analysis utilities for coupled pelagic–sediment simulations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "xarray>=2023.1"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
